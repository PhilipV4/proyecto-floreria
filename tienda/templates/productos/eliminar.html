{% extends 'base.html' %}

{% block content %}
<div class="container my-5" style="max-width: 500px;">
    <div class="card border-danger shadow">
        <div class="card-header bg-danger text-white">
            <h4 class="mb-0">Confirmar Eliminación</h4>
        </div>
        <div class="card-body text-center">
            <p class="fs-5">¿Estás seguro de que deseas eliminar el producto?</p>
            <h3 class="text-danger my-3">{{ producto.nombre }}</h3>
            
            {% if producto.imagen %}
                <img src="{{ producto.imagen.url }}" class="img-thumbnail mb-3" style="max-height: 120px;" alt="{{ producto.nombre }}">
            {% endif %}

            <p class="text-muted small">Esta acción no se puede deshacer.</p>

            <form method="POST">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3 mt-4">
                    <a href="{% url 'lista_productos' %}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-danger">Sí, Eliminar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
