<!DOCTYPE html>
<html lang="es" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Panel de Administración{% endblock %}</title>
    {% load static %}


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="{% static 'CSS/admin.css' %}">

    <script>
        const savedTheme = localStorage.getItem('admin-theme');
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-bs-theme', 'dark');
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js"
        integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg"
        crossorigin="anonymous"></script>

    <style>
        html[data-bs-theme="dark"] .card,
        html[data-bs-theme="dark"] .card-body,
        html[data-bs-theme="dark"] .card-header,
        html[data-bs-theme="dark"] .bg-light,
        html[data-bs-theme="dark"] .bg-white {
            background-color: var(--bs-tertiary-bg) !important;
            color: var(--bs-body-color) !important;
            border-color: var(--bs-border-color) !important;
        }

        html[data-bs-theme="dark"] .form-control,
        html[data-bs-theme="dark"] .form-select {
            background-color: var(--bs-body-bg) !important;
            color: var(--bs-body-color) !important;
            border-color: var(--bs-border-color) !important;
        }

        /* Para fijar el sidebar*/
        @media (min-width: 768px) {
            #sidebarOffcanvas {
                position: sticky;
                top: 0;
                height: 100vh;
                overflow-y: auto;
            }
            .main-content-wrapper {
                height: 100vh;
                overflow-y: auto;
            }
        }
    </style>

</head>

<body class="bg-body" style="min-height: 100vh; display: flex; flex-direction: column;">

    <nav class="navbar bg-body border-bottom px-3 d-md-none">
        <button class="btn btn-outline-secondary btn-sm" type="button" data-bs-toggle="offcanvas"
            data-bs-target="#sidebarOffcanvas" aria-controls="sidebarOffcanvas">
            <i class="bi bi-list fs-5"></i> Menú
        </button>
        <span class="fw-bold text-body">Florería Admin</span>
        <button class="btn btn-outline-secondary btn-sm theme-toggle" type="button"
            aria-label="Activar modo oscuro" aria-pressed="false">
            <i class="bi bi-moon-stars-fill"></i>
            <span class="d-none d-sm-inline">Modo oscuro</span>
        </button>
    </nav>

    <!-- Contenedor principal en formato Flex (Sidebar + Contenido) -->
    <div class="d-flex" style="min-height: 100vh;">

        <!-- SIDEBAR RESPONSIVE (Offcanvas en móvil, Fijo en desktop 'md+') -->
        <div class="offcanvas-md offcanvas-start bg-body border-end shadow-sm" tabindex="-1" id="sidebarOffcanvas"
            style="width: 280px;">

            <!-- Cabecera del Offcanvas (Solo visible en celulares cuando se despliega) -->
            <div class="offcanvas-header d-md-none border-bottom">
                <h5 class="offcanvas-title fw-bold">Menú de Gestión</h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebarOffcanvas"
                    aria-label="Close"></button>
            </div>

            <!-- Cuerpo del Sidebar -->
            <div class="offcanvas-body d-flex flex-column p-3 h-100">
                <a href="{% url 'admin_lista_productos' %}"
                    class="d-none d-md-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
                    <i class="bi bi-shop fs-4 text-primary me-2"></i>
                    <span class="fs-4 fw-bold">Florería Admin</span>
                </a>
                <hr class="d-none d-md-block" />

                <!-- Menú de navegación -->
                <ul class="nav nav-pills flex-column mb-auto">
                    <li class="nav-item mb-1">
                        <a href="{% url 'admin_dashboard' %}"
                            class="nav-link {% if request.resolver_match.url_name == 'admin_dashboard' %}active{% else %}link-body-emphasis{% endif %}">
                            <i class="bi bi-speedometer2 me-2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item mb-1">
                        <a href="{% url 'admin_lista_productos' %}"
                            class="nav-link {% if request.resolver_match.url_name == 'admin_lista_productos' %}active{% else %}link-body-emphasis{% endif %}">
                            <i class="bi bi-box-seam me-2"></i> Productos
                        </a>
                    </li>
                    <li class="nav-item mb-1">
                        <a href="#" class="nav-link link-body-emphasis">
                            <i class="bi bi-tags me-2"></i> Categorías
                        </a>
                    </li>
                    <li class="nav-item mb-1">
                        <a href="#" class="nav-link link-body-emphasis">
                            <i class="bi bi-calendar-event me-2"></i> Ocasiones
                        </a>
                    </li>
                    <li class="nav-item mb-1">
                        <a href="#" class="nav-link link-body-emphasis">
                            <i class="bi bi-cart-check me-2"></i> Pedidos
                        </a>
                    </li>
                    <li class="nav-item mb-1">
                        <a href="#" class="nav-link link-body-emphasis">
                            <i class="bi bi-people me-2"></i> Clientes
                        </a>
                    </li>
                </ul>

                

                <button class="btn btn-outline-secondary w-100 mb-3 theme-toggle" type="button" aria-pressed="false">
                    <i class="bi bi-moon-stars-fill me-2"></i>
                    <span>Activar modo oscuro</span>
                </button>
                <hr />
                <!-- Perfil de usuario en la parte inferior del sidebar -->
                <div class="dropdown">
                    <a href="#"
                        class="d-flex align-items-center link-body-emphasis text-decoration-none dropdown-toggle"
                        data-bs-toggle="dropdown" aria-expanded="false">
                        <img src="https://github.com/mdo.png" alt="" width="32" height="32"
                            class="rounded-circle me-2" />
                        <strong>Admin</strong>
                    </a>
                    <ul class="dropdown-menu text-small shadow">
                        <li><a class="dropdown-item" href="#">Configuración</a></li>
                        <li><a class="dropdown-item" href="#">Perfil</a></li>
                        <li>
                            <hr class="dropdown-divider" />
                        </li>
                        <li><a class="dropdown-item text-danger" href="#">Cerrar Sesión</a></li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Contenido-->
        <div class="flex-grow-1 overflow-auto">
            <main>
                {% block content %}
                {% endblock %}
            </main>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const themeButtons = document.querySelectorAll('.theme-toggle');

        function updateThemeButtons(theme) {
            themeButtons.forEach((button) => {
                const isDark = theme === 'dark';
                button.setAttribute('aria-pressed', String(isDark));
                button.setAttribute('aria-label', isDark ? 'Activar modo claro' : 'Activar modo oscuro');
                button.innerHTML = isDark
                    ? '<i class="bi bi-sun-fill me-2">'
                    : '<i class="bi bi-moon-stars-fill me-2">';
            });
        }

        updateThemeButtons(document.documentElement.getAttribute('data-bs-theme'));

        themeButtons.forEach((button) => {
            button.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-bs-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-bs-theme', newTheme);
                localStorage.setItem('admin-theme', newTheme);
                updateThemeButtons(newTheme);
            });
        });
    </script>

</body>

</html>
