{% extends 'admin/base_admin.html' %}

{% block content %}
<div class="container-fluid py-4 px-4">
    
    <!-- Encabezado del Dashboard -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="h3 fw-bold text-dark mb-0">Panel Principal</h2>
            <p class="text-muted small mb-0">Resumen general y métricas de la florería</p>
        </div>
        <!-- Espacio reservado para futuros botones de acción rápida -->
        <div>
            <!-- Ejemplo: <a href="#" class="btn btn-primary btn-sm">+ Acción Rápida</a> -->
        </div>
    </div>

    <!-- Fila de Tarjetas de Estadísticas (Placeholders) -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card border-0 shadow-sm p-3">
                <div class="text-muted small fw-semibold">Ventas del Mes</div>
                <h4 class="fw-bold text-success mt-1 mb-0">$0</h4>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm p-3">
                <div class="text-muted small fw-semibold">Productos en Catálogo</div>
                <h4 class="fw-bold text-primary mt-1 mb-0">0</h4>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm p-3">
                <div class="text-muted small fw-semibold">Pedidos Pendientes</div>
                <h4 class="fw-bold text-warning mt-1 mb-0">0</h4>
            </div>
        </div>
    </div>

    <!-- Contenedor en Blanco para Gráficos o Tablas futuras -->
    <div class="card border-0 shadow-sm">
        <div class="card-body text-center py-5">
            <i class="bi bi-bar-chart-line text-muted display-4 mb-3"></i>
            <h5 class="text-dark fw-bold">Área de trabajo en blanco</h5>
            <p class="text-muted small mb-0 mx-auto" style="max-width: 400px;">
                
        </div>
    </div>

</div>
{% endblock %}
