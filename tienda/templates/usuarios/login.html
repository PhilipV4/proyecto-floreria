{% extends 'global_componentes/base.html' %}
{% load static %}
{% block content %}



<div class="container my-5 py-4" style="max-width: 400px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">

            <div class="text-center mb-4">
                <h3 class="fw-bold text-dark">Florería</h3>
                <p class="text-muted small">Ingresa a tu cuenta</p>
            </div>

            <form method="POST">
                {% csrf_token %}

                {% if form.errors %}
                <div class="alert alert-danger py-2 small mb-3">
                    Usuario o contraseña incorrectos. Inténtalo nuevamente.
                </div>
                {% endif %}

                <div class="mb-3">
                    <label for="id_username" class="form-label small fw-bold">Usuario</label>
                    <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username"
                        maxlength="150" required class="form-control" id="id_username"
                        placeholder="Tu nombre de usuario">
                </div>

                <div class="mb-3">
                    <label for="id_password" class="form-label small fw-bold">Contraseña</label>
                    <input type="password" name="password" autocomplete="current-password" required class="form-control"
                        id="id_password" placeholder="••••••••">
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                    Iniciar Sesión
                </button>
            </form>
            <div class="text-center mt-3">
                <p class="small text-muted mb-0">¿No tienes una cuenta? <a href="{% url 'registro' %}"
                        class="text-decoration-none">Regístrate</a></p>
            </div>

        </div>
    </div>
</div>
{% endblock %}
