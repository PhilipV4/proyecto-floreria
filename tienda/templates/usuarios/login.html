<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Florería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="container" style="max-width: 400px;">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-dark">Florería</h3>
                    <p class="text-muted small">Ingresa a tu cuenta</p>
                </div>

                <form method="POST">
                    {% csrf_token %}

                    {% if form.errors %}
                        <div class="alert alert-danger py-2 small mb-3">
                            Usuario o contraseña incorrectos. Inténtalo nuevamente.
                        </div>
                    {% endif %}

                    <div class="mb-3">
                        <label for="id_username" class="form-label small fw-bold">Usuario</label>
                        <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" maxlength="150" required class="form-control" id="id_username" placeholder="Tu nombre de usuario">
                    </div>

                    <div class="mb-3">
                        <label for="id_password" class="form-label small fw-bold">Contraseña</label>
                        <input type="password" name="password" autocomplete="current-password" required class="form-control" id="id_password" placeholder="••••••••">
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                        Iniciar Sesión
                    </button>
                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html
